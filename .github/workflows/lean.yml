name: Lean build and finite audit

on:
  workflow_dispatch:
  push:
    branches: ["main", "research/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive finite quotient audit
        run: python3 experiments/finite_quotient_audit.py
      - name: Exact random-frame counts for n=3,4
        run: python3 experiments/exact_random_frames.py
      - name: Exhaustive chain edge cardinality audit
        run: python3 experiments/chain_edge_counting_audit.py
      - name: Exhaustive balanced-map overlap audit
        run: python3 experiments/chain_overlap_audit.py
      - name: Exact chain fixed-map probability audit
        run: python3 experiments/chain_full_map_audit.py
      - name: Goranko chain-frame first-moment numerical audit
        run: python3 experiments/goranko_chain_first_moment.py
      - name: First-moment numerical audit for F0001 and F1001
        run: python3 experiments/expected_partition_sum.py
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Explicitly build exact finite enumeration module
        run: lake build RandomKripke.ExactSmallN
      - name: Explicitly build F1001 fibre characterization
        run: lake build RandomKripke.F1001Characterization
      - name: Explicitly build F0001 witness module
        run: lake build RandomKripke.F0001Witness
      - name: Explicitly build Goranko eta counterexample
        run: lake build RandomKripke.GorankoEtaCounterexample
      - name: Explicitly build general chain modules
        run: |
          lake build RandomKripke.ChainFrames
          lake build RandomKripke.ChainEdgeCounting
      - name: Audit Lean source and theorem axioms
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          paths = [pathlib.Path("RandomKripke.lean"), *sorted(pathlib.Path("RandomKripke").rglob("*.lean"))]
          names = []
          for path in paths:
              src = path.read_text(encoding="utf-8")
              # Conservative token guard: comments mentioning these tokens also fail.
              if re.search(r"\b(sorry|admit|sorryAx|axiom)\b", src):
                  raise SystemExit(f"Forbidden proof-placeholder or explicit axiom token in {path}")
              if path.name != "RandomKripke.lean":
                  names.extend(re.findall(r"(?m)^theorem\s+([A-Za-z_][A-Za-z_0-9']*)\b", src))
          if not names:
              raise SystemExit("No theorem declarations found")
          pathlib.Path("AuditAxioms.lean").write_text("import RandomKripke\n" + "".join(f"#print axioms RandomKripke.{name}\n" for name in names), encoding="utf-8")
          print(f"Auditing {len(names)} theorem declarations")
          PY
          # Explicitly build all project module files, including newly added ones.
          while IFS= read -r path; do
            module="${path%.lean}"
            lake build "${module//\//.}"
          done < <(find RandomKripke -name '*.lean' -type f | sort)
          set -o pipefail
          lake env lean AuditAxioms.lean | tee axiom-audit.txt
          if grep -w sorryAx axiom-audit.txt; then
            echo "A theorem depends on sorryAx"
            exit 1
          fi
          rm AuditAxioms.lean
