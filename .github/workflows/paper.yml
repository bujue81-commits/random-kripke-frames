name: Build research manuscript

on:
  workflow_dispatch:
  push:
    branches: ["research/**"]
    paths:
      - "paper/manuscript.tex"
      - "paper/manuscript_biased.tex"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "paper/manuscript.tex"
      - "paper/manuscript_biased.tex"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

jobs:
  latex:
    strategy:
      fail-fast: false
      matrix:
        source: [manuscript, manuscript_biased]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile full manuscript
        run: |
          mkdir -p paper/build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=paper/build paper/${{ matrix.source }}.tex
      - name: Upload PDF and compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.source }}-and-build-log
          path: |
            paper/build/${{ matrix.source }}.pdf
            paper/build/${{ matrix.source }}.log
          if-no-files-found: warn
