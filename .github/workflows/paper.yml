name: Build research manuscript

on:
  workflow_dispatch:
  push:
    branches: ["research/**"]
    paths:
      - "paper/manuscript.tex"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "paper/manuscript.tex"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile full manuscript
        run: |
          mkdir -p paper/build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=paper/build paper/manuscript.tex
      - name: Upload PDF and compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-and-build-log
          path: |
            paper/build/manuscript.pdf
            paper/build/manuscript.log
          if-no-files-found: warn
